<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Customer Churn Predictor</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .glass-container {
            background: var(--container-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .input-group:focus-within label {
            color: var(--primary);
        }

        input, select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        option {
            background: var(--bg-color);
            color: white;
        }

        .submit-btn {
            grid-column: 1 / -1;
            background: linear-gradient(to right, var(--primary), #6366f1);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result-card {
            margin-top: 2rem;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            animation: slideUp 0.5s ease-out;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .result-card.churn {
            border-top: 4px solid var(--danger);
        }
        .result-card.churn h2 { color: var(--danger); }

        .result-card.retained {
            border-top: 4px solid var(--success);
        }
        .result-card.retained h2 { color: var(--success); }

        .prob-text {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="header">
            <h1>Customer Churn Prediction</h1>
            <p>AI-powered banking retention intelligence</p>
        </div>

        <form action="/predict" method="POST">
            <div class="form-grid">
                <div class="input-group">
                    <label for="geography">Geography</label>
                    <select id="geography" name="geography" required>
                        <option value="" disabled selected>Select country</option>
                        <option value="France">France</option>
                        <option value="Germany">Germany</option>
                        <option value="Spain">Spain</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="18" max="100" placeholder="e.g. 35" required>
                </div>

                <div class="input-group">
                    <label for="credit_score">Credit Score</label>
                    <input type="number" id="credit_score" name="credit_score" min="300" max="850" placeholder="300 - 850" required>
                </div>

                <div class="input-group">
                    <label for="tenure">Tenure (Years)</label>
                    <input type="number" id="tenure" name="tenure" min="0" max="10" placeholder="0 - 10" required>
                </div>

                <div class="input-group">
                    <label for="balance">Account Balance</label>
                    <input type="number" step="0.01" id="balance" name="balance" placeholder="e.g. 100000" required>
                </div>

                <div class="input-group">
                    <label for="num_of_products">Number of Products</label>
                    <input type="number" id="num_of_products" name="num_of_products" min="1" max="4" placeholder="1 - 4" required>
                </div>

                <div class="input-group">
                    <label for="estimated_salary">Estimated Salary</label>
                    <input type="number" step="0.01" id="estimated_salary" name="estimated_salary" placeholder="e.g. 75000" required>
                </div>

                <div class="input-group">
                    <label for="has_cr_card">Has Credit Card?</label>
                    <select id="has_cr_card" name="has_cr_card" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="is_active_member">Active Member?</label>
                    <select id="is_active_member" name="is_active_member" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Predict Churn Risk</button>
            </div>
        </form>

        {% if results %}
        <div class="result-card {% if prediction == 1 %}churn{% else %}retained{% endif %}">
            <h2>{{ results }}</h2>
            <p class="prob-text">{{ probability }}</p>
        </div>
        {% endif %}

    </div>

</body>
</html>
